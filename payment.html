         <script>
     const bookingDateInput = document.getElementById("bookingDate");
     const startTimeInput = document.getElementById("startTime");
     const endTimeInput = document.getElementById("endTime");
     const durationText = document.getElementById("durationText");
     const totalPriceDisplay = document.getElementById("totalPrice");
     
     const place = localStorage.getItem("placeName");
     const price = localStorage.getItem("price") || 20;
     const availableStart = localStorage.getItem("availableStart") || "00:00";
     const availableEnd = localStorage.getItem("availableEnd") || "23:59";

     if (place) {
         document.getElementById("place").innerText = "المكان: " + place;
         document.getElementById("hourlyPrice").innerText = "السعر في الساعة: " + price + " ج.م";
         document.getElementById("workingHours").innerText = `متاح من ${availableStart} إلى ${availableEnd}`;
     }

     // Set default date to today
     const today = new Date().toISOString().split('T')[0];
     bookingDateInput.value = today;
     bookingDateInput.min = today;

     function updatePrice() {
         const start = startTimeInput.value.split(':');
         const end = endTimeInput.value.split(':');
         
         const startMin = parseInt(start[0]) * 60 + parseInt(start[1]);
         const endMin = parseInt(end[0]) * 60 + parseInt(end[1]);
         
         let diffMin = endMin - startMin;
         if (diffMin < 0) diffMin += 1440;

         let hours = Math.ceil(diffMin / 60);
         if (hours === 0) hours = 1;

         const total = hours * price;
         
         durationText.innerText = "المدة: " + hours + " ساعة";
         totalPriceDisplay.innerText = "إجمالي الحساب: " + total + " ج.م";

         if (!checkWorkingHours(startMin, endMin)) {
             const payBtn = document.querySelector('button[onclick="payNow()"]');
             payBtn.disabled = true;
             payBtn.innerText = `عذراً، أوقات العمل من ${availableStart} إلى ${availableEnd}`;
             payBtn.style.background = "#555";
             return;
         }

         // Check for overlaps
         checkOverlap(bookingDateInput.value, startMin, endMin);
     }

     function checkWorkingHours(reqStart, reqEnd) {
         const availStart = availableStart.split(':');
         const availEnd = availableEnd.split(':');
         const availStartMin = parseInt(availStart[0]) * 60 + parseInt(availStart[1]);
         const availEndMin = parseInt(availEnd[0]) * 60 + parseInt(availEnd[1]);

         if (availStartMin === 0 && (availEndMin === 1439 || availEndMin === 0)) return true;

         if (availEndMin < availStartMin) {
             if (reqStart <= reqEnd) {
                 if ((reqStart >= availStartMin && reqEnd >= availStartMin) || (reqStart <= availEndMin && reqEnd <= availEndMin)) {
                     return true;
                 }
                 return false;
             } else {
                 if (reqStart >= availStartMin && reqEnd <= availEndMin) return true;
                 return false;
             }
         } else {
             if (reqStart > reqEnd) return false;
             return (reqStart >= availStartMin && reqEnd <= availEndMin);
         }
     }

     function checkOverlap(date, newStart, newEnd) {
         const reservations = JSON.parse(localStorage.getItem("allReservations") || "[]");
         const currentPlace = localStorage.getItem("placeName");
         const payBtn = document.querySelector('button[onclick="payNow()"]');
         
         const isOverlap = reservations.some(res => {
             if (res.placeName !== currentPlace || res.date !== date) return false;
             return (newStart < res.endMin) && (newEnd > res.startMin);
         });

         if (isOverlap) {
             payBtn.disabled = true;
             payBtn.innerText = "عذراً.. هذا الوقت محجوز بالفعل في هذا اليوم";
             payBtn.style.background = "#555";
         } else {
             payBtn.disabled = false;
             payBtn.innerText = "ادفع الآن";
             payBtn.style.background = "linear-gradient(135deg, #D4AF37, #b8962e)";
         }
     }

     bookingDateInput.addEventListener("input", updatePrice);
     startTimeInput.addEventListener("input", updatePrice);
     endTimeInput.addEventListener("input", updatePrice);
     updatePrice(); 

     // Update map dynamically
     if (place) {
         const mapUrl = `https://maps.google.com/maps?q=${encodeURIComponent(place + ", Egypt")}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
         document.getElementById("mapFrame").src = mapUrl;
     }
     
     function payNow() {
       const date = bookingDateInput.value;
       const start = startTimeInput.value.split(':');
       const end = endTimeInput.value.split(':');
       const startMin = parseInt(start[0]) * 60 + parseInt(start[1]);
       let endMin = parseInt(end[0]) * 60 + parseInt(end[1]);
       if (endMin < startMin) endMin += 1440;

       if (!date) {
           alert("برجاء اختيار التاريخ");
           return;
       }

       // Save reservation
       const reservations = JSON.parse(localStorage.getItem("allReservations") || "[]");
       reservations.push({
           placeName: localStorage.getItem("placeName"),
           date: date,
           startMin: startMin,
           endMin: endMin
       });
       localStorage.setItem("allReservations", JSON.stringify(reservations));

       // Send Email via Google Apps Script
       const userEmail = localStorage.getItem('userEmail');
       const userName = localStorage.getItem('userName') || 'عميلنا العزيز';
       const placeName = localStorage.getItem("placeName");
       const totalPrice = document.getElementById("totalPrice").innerText.replace("إجمالي الحساب: ", "");

       if (userEmail) {
           // ستقوم بتبديل هذا الرابط بالرابط الذي ستحصل عليه من جوجل
           const scriptURL = 'https://script.google.com/macros/s/AKfycby883BVBja7Oc3njTR8Pws3DyCDS_ckCjBH2Gj3GKgLDD8LbU9Mp8FVmXyDoMiT_oczBQ/exec'; 
           
           if (scriptURL !== 'YOUR_GOOGLE_SCRIPT_URL') {
               const formData = new URLSearchParams();
               formData.append('email', userEmail);
               formData.append('userName', userName);
               formData.append('placeName', placeName);
               formData.append('date', date);
               formData.append('start', startTimeInput.value);
               formData.append('end', endTimeInput.value);
               formData.append('price', totalPrice);
               
               // إرسال الطلب في الخلفية
               fetch(scriptURL, {
                   method: 'POST',
                   body: formData,
                   mode: 'no-cors'
               }).then(() => {
                   console.log('Email sent!');
               }).catch(error => console.error('Error!', error.message));
           }
       }

       showAlert(`لقد تم تأكيد حجزك ليوم ${date} بنجاح، وسيصلك إيميل بكافة التفاصيل قريباً. نتمنى لك قيادة آمنة!`, true, "index.html");
     }
     </script>
