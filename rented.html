<section class="add-place-section">
  <div class="container">

    <div class="form-box">

      <h3 class="section-title">المعلومات الأساسية</h3>

      <div class="form-grid">

        <div class="input-group">
          <label>اسم المكان</label>
          <input type="text" placeholder="ادخل اسم المكان">
        </div>

        <div class="input-group">
          <label>الموقع</label>
          <input type="text" placeholder="ادخل الموقع بدقة">
        </div>

        <div class="input-group">
          <label>السعر في الساعة (ج.م)</label>
          <input type="number" placeholder="ادخل السعر في الساعة">
        </div>

        <div class="input-group">
          <label>السعر اليومي (ج.م)</label>
          <input type="number" placeholder="ادخل السعر اليومي">
        </div>

      </div>

      <div class="input-group full">
        <label>الوصف</label>
        <textarea placeholder="اكتب وصف المكان والخدمات..."></textarea>
      </div>

      <div class="features">
        <button type="">مياه</button>
        <button>كهرباء</button>
        <button>مظلل</button>
        <button>أمن 24 ساعة</button>
        <button>كاميرات</button>
      </div>

      <div class="images-section">
        <input type="file" id="fileInput" multiple accept="image/*" style="display: none;">
        <div class="upload-box" id="uploadTrigger" style="cursor: pointer;">
          <p>إضافة صور</p>
        </div>

        <div class="image-preview-container d-flex gap-2">
          <div class="image-preview"></div>
        </div>
      </div>

      <div class="map-box" id="map">
        <!-- Map will be initialized here -->
      </div>

      <div class="form-actions">
        <button class="cancel">إلغاء</button>
        <button class="submit">إضافة المكان</button>
      </div>

    </div>

  </div>
</section>

</main>
    
    <script src="js/bootstrap.bundle.js"></script>
    
    <!-- Leaflet Map JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
      // Initialize Map
      const map = L.map('map').setView([30.0444, 31.2357], 11); // Cairo
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      let marker;
      map.on('click', function(e) {
          if (marker) {
              marker.setLatLng(e.latlng);
          } else {
              marker = L.marker(e.latlng, {draggable: true}).addTo(map);
          }
          // Optionally update the location input field
          console.log("Selected Location:", e.latlng);
      });

      // Feature Buttons Toggling
      const featureButtons = document.querySelectorAll('.features button');
      featureButtons.forEach(btn => {
          btn.addEventListener('click', function(e) {
              e.preventDefault();
              this.classList.toggle('active');
          });
      });

      // Form Submission
      document.querySelector('.submit').addEventListener('click', function() {
          const name = document.querySelector('input[placeholder="ادخل اسم المكان"]').value;
          const locationName = document.querySelector('input[placeholder="ادخل الموقع بدقة"]').value;
          const price = document.querySelector('input[placeholder="ادخل السعر في الساعة"]').value;
          const desc = document.querySelector('textarea').value;
          const img = document.querySelector('.image-preview img') ? document.querySelector('.image-preview img').src : 'img/ChatGPT Image Apr 29, 2026, 12_42_48 AM.png';
          
          if (!name || !locationName || !price) {
              alert("برجاء إكمال البيانات الأساسية (الاسم، الموقع، السعر)");
              return;
          }

          // Create place object
          const newPlace = {
              name: name,
              location: locationName,
              price: price,
              desc: desc,
              image: img,
              rating: "5.0" // New places start with 5 stars
          };

          // Save to localStorage
          let savedPlaces = JSON.parse(localStorage.getItem("myAddedPlaces") || "[]");
          savedPlaces.push(newPlace);
          localStorage.setItem("myAddedPlaces", JSON.stringify(savedPlaces));

          alert("تم إضافة مكانك بنجاح! سيظهر الآن في الأماكن المتاحة ✅");
          location.href = "tenant.html";
      });

      // Cancel Button
      document.querySelector('.cancel').addEventListener('click', function() {
          if (confirm("هل أنت متأكد من إلغاء الإضافة؟")) {
              location.href = "index.html";
          }
      });

      // Image Upload and Preview
      const fileInput = document.getElementById('fileInput');
      const uploadTrigger = document.getElementById('uploadTrigger');
      const previews = document.querySelectorAll('.image-preview');

      uploadTrigger.addEventListener('click', () => fileInput.click());

      fileInput.addEventListener('change', function() {
          const files = this.files;
          if (files && files[0]) {
              // Clear previous preview
              previews[0].innerHTML = '';
              
              const reader = new FileReader();
              reader.onload = function(e) {
                  const img = document.createElement('img');
                  img.src = e.target.result;
                  img.style.width = '100%';
                  img.style.height = '100%';
                  img.style.objectFit = 'cover';
                  img.style.borderRadius = '10px';
                  previews[0].appendChild(img);
              }
              reader.readAsDataURL(files[0]);
          }
      });
    </script>
</body>
</html>
