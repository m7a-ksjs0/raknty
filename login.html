      <header class="d">

      <section class="login-section">
        <div class="container d-flex justify-content-center">
            <div class="login-box" id="authBox">
                <!-- Content injected via JS -->
            </div>
        </div>
      </section>
    </main>
    
    <script src="js/bootstrap.bundle.js"></script>
    <script>
        let isLoginMode = false; // Start with registration
        
        function renderAuthForm() {
            const authBox = document.getElementById('authBox');
            if (isLoginMode) {
                authBox.innerHTML = `
                    <h2>تسجيل الدخول</h2>
                    <p>أهلاً بك مجدداً في ركنتي</p>
                    <form onsubmit="handleLogin(event)">
                        <div class="input-group">
                            <label>البريد الإلكتروني</label>
                            <input type="email" id="loginEmail" placeholder="أدخل بريدك الإلكتروني" required>
                        </div>
                        <div class="input-group">
                            <label>كلمة المرور</label>
                            <input type="password" id="loginPassword" placeholder="أدخل كلمة المرور" required>
                        </div>
                        <button type="submit" class="submit-btn">دخول</button>
                    </form>
                    <div class="toggle-text">ليس لديك حساب؟ <span onclick="toggleMode()">سجل الآن</span></div>
                `;
            } else {
                authBox.innerHTML = `
                    <h2>إنشاء حساب</h2>
                    <p>انضم إلينا وابدأ في حجز مكانك</p>
                    <form onsubmit="handleRegister(event)">
                        <div class="input-group">
                            <label>الاسم الكامل</label>
                            <input type="text" id="regName" placeholder="أدخل اسمك الكامل" required>
                        </div>
                        <div class="input-group">
                            <label>البريد الإلكتروني</label>
                            <input type="email" id="regEmail" placeholder="أدخل بريدك الإلكتروني" required>
                        </div>
                        <div class="input-group">
                            <label>كلمة المرور</label>
                            <input type="password" id="regPassword" placeholder="أدخل كلمة المرور" required>
                        </div>
                        <button type="submit" class="submit-btn">إنشاء حساب</button>
                    </form>
                    <div class="toggle-text">لديك حساب بالفعل؟ <span onclick="toggleMode()">تسجيل الدخول</span></div>
                `;
            }
        }

        function toggleMode() {
            isLoginMode = !isLoginMode;
            renderAuthForm();
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            
            // Save to localStorage
            localStorage.setItem('userLoggedIn', 'true');
            localStorage.setItem('userName', name);
            localStorage.setItem('userEmail', email);
            
            showAlert("تم إنشاء الحساب بنجاح! مرحباً بك.", true);
            setTimeout(() => checkRedirect(), 1500);
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            
            // Dummy login logic
            localStorage.setItem('userLoggedIn', 'true');
            localStorage.setItem('userEmail', email);
            localStorage.setItem('userName', email.split('@')[0]); // Fake name
            
            showAlert("تم تسجيل الدخول بنجاح! مرحباً بك.", true);
            setTimeout(() => checkRedirect(), 1500);
        }

        function checkRedirect() {
            const redirectParams = new URLSearchParams(window.location.search);
            const redirectUrl = redirectParams.get('redirect');
            if (redirectUrl) {
                window.location.href = redirectUrl;
            } else {
                window.location.href = 'index.html';
            }
        }

        // Check if already logged in
        if (localStorage.getItem('userLoggedIn') === 'true') {
            checkRedirect();
        } else {
            renderAuthForm();
        }
    </script>
    <script src="js/auth.js"></script>
</body>
</html>
